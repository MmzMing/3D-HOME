      .stage {
        position: relative;

        height: 630px;
        color: #f3f4f6;
        font-family: 'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;

        position: absolute;
        top: 50%;
        right: -150px;
        width: 1020px;

        width: 100%;

        top: 50%;

        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0.34em;
